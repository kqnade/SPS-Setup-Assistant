name: Prepare VPM release draft
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vpm-release
  cancel-in-progress: false
jobs:
  draft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate and build package
        shell: pwsh
        run: |
          python ./Tools/Test-VpmDistribution.py
          if ($LASTEXITCODE -ne 0) { throw 'Fork distribution validation failed' }
          ./Tools/Validate-Package.ps1
          ./Tools/Build-VpmPackage.ps1
      - name: Create immutable release draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const manifest = JSON.parse(fs.readFileSync('.artifacts/vpm/package.json', 'utf8'));
            const version = manifest.version;
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${version}` });
              throw new Error(`Tag ${version} already exists; do not overwrite published versions.`);
            } catch (error) { if (error.status !== 404) throw error; }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            if (releases.some(r => r.tag_name === version)) throw new Error('Release already exists, including drafts.');
            const release = await github.rest.repos.createRelease({ owner, repo,
              tag_name: version, target_commitish: context.sha, name: `SPS2 Setup Assistant ${version} (kqnade fork)`,
              draft: true, prerelease: version.includes('-'),
              body: `Unofficial prerelease based on LumaKroma/SPS2-Setup-Assistant 1.1.1, with exact SPS3 Auto and Legacy Support menu-label recognition. Full SPS3 compatibility is not certified.\n\nSource: ${context.sha}\n\nUnity compilation, EditMode tests, VRChat runtime behavior and VCC/ALCOM installation are unverified. Back up the entire project before installation.\n\nVPM repository: https://kqnade.github.io/SPS-Setup-Assistant/index.json\nEnable prerelease packages in VCC/ALCOM and select version ${version}.` });
            for (const name of [`${manifest.name}-${version}.zip`, 'package.json']) {
              const data = fs.readFileSync(path.join('.artifacts/vpm', name));
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.data.id,
                name, data, headers: { 'content-type': 'application/octet-stream', 'content-length': data.length } });
            }
            core.notice(`Draft prepared: ${release.data.html_url}`);
